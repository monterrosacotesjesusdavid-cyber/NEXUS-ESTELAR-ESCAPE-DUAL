<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Nexus Estelar: Escape Dual</title>
<style>
  html,body{margin:0;height:100%;background:#05071a;color:#fff;font-family:monospace;overflow:hidden;touch-action:none}
  #lobby{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#05071a;z-index:5;text-align:center;padding:20px}
  #lobby h1{font-size:26px;margin:0;line-height:1.3}
  #lobby input{font:20px monospace;padding:10px;text-align:center;text-transform:uppercase;width:180px}
  #lobby button{font:20px monospace;padding:10px 24px;background:#ffd86b;border:0;cursor:pointer}
  canvas{display:block;margin:auto;width:100vw;height:100vh;object-fit:contain;image-rendering:pixelated}
  #touch button{position:fixed;z-index:4;width:54px;height:54px;border-radius:12px;border:2px solid #6c78c9;background:rgba(20,28,80,.7);color:#fff;font:18px monospace;user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<div id="lobby">
  <h1>🚀 NEXUS ESTELAR<br>ESCAPE DUAL</h1>
  <div>Escribe un código de sala y compártelo con tu pareja</div>
  <input id="code" maxlength="8" placeholder="SALA">
  <button id="go">ENTRAR</button>
  <div id="msg"></div>
</div>
<canvas id="c"></canvas>
<div id="touch"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
